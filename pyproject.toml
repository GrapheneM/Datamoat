[project]
name = "datamoat-institute-intelligence"
version = "0.1.0"
description = "Python Streamlit institute intelligence app backed by PostgreSQL"
requires-python = ">=3.12,<3.15"
dependencies = [
    "argon2-cffi>=25.1.0",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "plotly>=5.24",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.1.6",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]
